<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daybook</title>
  <meta name="description" content="A personal planner, diary and fitness log.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f3f0">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('daybook.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app">
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="main">
      <header class="topbar">
        <h1 id="title">Daybook</h1>
        <div class="topbar-actions">
          <button id="syncBtn" class="icon-btn" type="button" aria-label="Sync status"></button>
          <a class="icon-btn topbar-settings" href="#/settings" aria-label="Settings">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></svg>
          </a>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1">
        <div class="boot" aria-busy="true">Loading…</div>
      </main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Daybook needs JavaScript turned on.</p></noscript>
</body>
</html>
